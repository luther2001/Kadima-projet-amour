[02:42, 3/9/2026] Kadim’s: <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ Notre Histoire d'Amour ✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { font-family: 'Georgia', serif; background: #1a0f1a; color: white; overflow: hidden; height: 100vh; width: 100vw; position: fixed; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a0f1a; display: flex; justify-content: center; align-items: center; z-index: 1000; transition: opacity 1s; }
        .loading-heart { font-size: 4rem; animation: heartbeat 1s infinite; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        .step { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; background: linear-gradient(145deg, #1a0f1a, #2d1a2d); padding: 20px; text-align: center; }
        .step.active { display: flex; flex-direction: column; }
        .btn { background: #ff69b4; color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 20px rgba(255,105,180,0.4); margin-top: 20px; }
        #step2 { overflow-y: auto; padding: 10px; }
        .reference-box img { width: 150px; height: 150px; border-radius: 15px; border: 3px solid #ff69b4; object-fit: cover; margin: 10px; }
        .solution-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 15px; margin: 10px auto; width: 280px; }
        .cell { aspect-ratio: 1/1; background: rgba(255,255,255,0.05); border: 2px dashed #ff69b4; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; border-radius: 8px; }
        .cell.filled { border: 2px solid #ff69b4; background: rgba(255,105,180,0.2); color: #ff69b4; font-weight: bold; }
        .pieces-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 280px; margin: 10px auto; }
        .piece-btn { aspect-ratio: 1/1; background: #ff69b4; border: none; border-radius: 10px; color: white; font-size: 1.2rem; font-weight: bold; }
        .piece-btn.selected { border: 3px solid white; transform: scale(1.1); }
        .victory-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .victory-box { background: #ff69b4; padding: 30px; border-radius: 30px; border: 4px solid white; }
        .book-container { perspective: 1500px; width: 300px; height: 400px; position: relative; }
        .book { width: 100%; height: 100%; transform-style: preserve-3d; transition: 1s; }
        .book.open { transform: rotateY(-20deg); }
        .cover { position: absolute; width: 100%; height: 100%; background: #ff69b4; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; backface-visibility: hidden; }
        .page { position: absolute; width: 100%; height: 100%; background: white; border-radius: 10px; padding: 10px; color: #333; transform-origin: left; transition: 1s; transform: rotateY(180deg); backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .page img { max-width: 90%; max-height: 70%; border-radius: 5px; margin-bottom: 10px; object-fit: cover; }
        .heart-photo { position: absolute; width: 60px; height: 60px; border-radius: 10px; object-fit: cover; border: 2px solid white; transition: 2s; }
    </style>
</head>
<body>
    <div id="loading"><div class="loading-heart">❤️</div></div>

    <div id="step1" class="step active">
        <h1>✨ Pour toi ma vie ✨</h1>
        <p>Résous ce petit défi pour voir notre histoire...</p>
        <button class="btn" onclick="app.startPuzzle()">Commencer</button>
    </div>

    <div id="step2" class="step">
        <h2>🧩 Reconstitue l'ordre</h2>
        <div class="reference-box"><img src="photo1.jpg" id="refImg"></div>
        <div class="solution-grid" id="solGrid"></div>
        <div class="pieces-grid" id="pieceGrid"></div>
        <div id="status">0/9</div>
    </div>

    <div id="step3" class="step">
        <div class="book-container" onclick="app.openBook()">
            <div class="book" id="book">
                <div class="cover"><h2>Nos Souvenirs</h2><p>Touche pour ouvrir ❤️</p></div>
                <div id="pages"></div>
            </div>
        </div>
    </div>

    <div id="step4" class="step">
        <div id="heartCont" style="position:relative;width:100%;height:100%;"></div>
        <div style="position:absolute;bottom:10%;width:100%;"><h2>Je t'aime ❤️</h2></div>
    </div>

    <script>
        const PHOTOS = [
            {f:'photo1.jpg', c:"Notre premier regard"}, {f:'photo2.jpg', c:"Ton sourire magique"},
            {f:'photo3.jpg', c:"Ce jour là..."}, {f:'photo4.jpg', c:"Toi et Moi"},
            {f:'photo5.jpg', c:"Mon bonheur"}, {f:'photo6.jpg', c:"Cette étincelle"},
            {f:'photo7.jpg', c:"Rien que toi"}, {f:'photo8 (2).jpg', c:"Notre complicité"},
            {f:'photo9 (2).jpg', c:"Je t'aime"}, {f:'photo10.jpg', c:"Magie pure"},
            {f:'photo11.jpg', c:"Pour toujours"}, {f:'photo12.jpg', c:"Mon âme soeur"},
            {f:'photo13.jpg', c:"L'histoire parfaite"}, {f:'photo14.jpg.jpeg', c:"Mon tout"},
            {f:'photo15.jpg', c:"A l'infini"}
        ];

        class LoveApp {
            constructor() {
                this.pieces = [1,2,3,4,5,6,7,8,9];
                this.sol = Array(9).fill(null);
                this.sel = null;
                setTimeout(() => document.getElementById('loading').style.display='none', 2000);
            }
            goTo(s) { document.querySelectorAll('.step').forEach(x=>x.classList.remove('active')); document.getElementById('step'+s).classList.add('active'); }
            startPuzzle() { this.goTo(2); this.renderPz(); }
            renderPz() {
                const sg = document.getElementById('solGrid'); sg.innerHTML='';
                this.sol.forEach((v,i) => {
                    let c = document.createElement('div'); c.className='cell'+(v?' filled':'');
                    c.textContent = v || '?'; c.onclick = () => this.place(i); sg.appendChild(c);
                });
                const pg = document.getElementById('pieceGrid'); pg.innerHTML='';
                this.pieces.forEach((p,i) => {
                    let b = document.createElement('button'); b.className='piece-btn'+(this.sel===i?' selected':'');
                    b.textContent=p; b.onclick=()=> {this.sel=i; this.renderPz();}; pg.appendChild(b);
                });
                document.getElementById('status').textContent = this.sol.filter(x=>x).length + "/9";
            }
            place(i) {
                if(this.sel===null || this.sol[i]) return;
                this.sol[i] = this.pieces[this.sel]; this.pieces.splice(this.sel,1); this.sel=null;
                this.renderPz(); if(this.sol.every(x=>x)) this.check();
            }
            check() {
                if(this.sol.every((v,i)=>v===i+1)) {
                    let v = document.createElement('div'); v.className='victory-overlay';
                    v.innerHTML = '<div class="victory-box"><h2>Bravo ! ❤️</h2><button class="btn" onclick="app.startBook()">Voir la suite</button></div>';
                    document.body.appendChild(v);
                } else { alert("L'ordre n'est pas bon !"); this.pieces=[1,2,3,4,5,6,7,8,9]; this.sol=Array(9).fill(null); this.renderPz(); }
            }
            startBook() { document.querySelector('.victory-overlay').remove(); this.goTo(3); this.initB(); }
            initB() {
                const pc = document.getElementById('pages'); pc.innerHTML='';
                PHOTOS.forEach(p => {
                    let d = document.createElement('div'); d.className='page';
                    d.innerHTML = <img src="${p.f}"><p>${p.c}</p>; pc.appendChild(d);
                });
            }
            openBook() {
                document.getElementById('book').classList.add('open');
                let pgs = document.querySelectorAll('.page'); let cur=0;
                let itv = setInterval(() => {
                    if(cur<pgs.length) { pgs[cur].style.transform='rotateY(0deg)'; cur++; }
                    else { clearInterval(itv); setTimeout(()=>this.final(), 2000); }
                }, 1500);
            }
            final() { this.goTo(4); const c = document.getElementById('heartCont');
                PHOTOS.forEach(p => {
                    let img = document.createElement('img'); img.src=p.f; img.className='heart-photo';
                    img.style.left=Math.random()*80+'%'; img.style.top=Math.random()*80+'%'; c.appendChild(img);
                });
                setTimeout(() => {
                    document.querySelectorAll('.heart-photo').forEach((img,i) => {
                        const t = (i/PHOTOS.length)*Math.PI*2;
                        const x = 16*Math.pow(Math.sin(t),3);
                        const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
                        img.style.left = (50 + x*3) + '%'; img.style.top = (40 - y*3) + '%';
                    });
                }, 500);
            }
        }
        const app = new LoveApp();
    </script>
</body>
</html>
